<!DOCTYPE html>
<html>
<head>
    <title>Login - Study Planner</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>
<body>

    <header>
        <div class="brand">
            <img src="../asset/Logo.jpg" alt="GoalGrid Logo" class="logo">
            <h2>Goal<span>Grid</span></h2>
        </div>

        <nav>
            <a href="../pages/index.html">Home</a>
            <a href="../pages/about.html">About</a>
            <a href="../pages/dashboard.html">Dashboard</a>
            <a href="../pages/contact.html">Contact</a>
            <a href="../pages/login.html" class="login-link">Login</a>
        </nav>
    </header>

    <section class="login-section">
        <div class="login-box">
            <h1>Welcome Back!</h1>
            <p>Login to plan your studies.</p>

            <form action="#">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username"
                       placeholder="Enter your username" required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" required>

                <button type="submit" class="button">LOGIN</button>
            </form>

            <p class="signup">
                New student? <a href="#signup">Create an account</a>
            </p>
        </div>
    </section>

    <footer>
        <h3>📚 GoalGrid</h3>
        <p>Learn Better. Plan Smarter. Achieve More!</p>
        <p>© 2026 Student Study Planner</p>
    </footer>

</body>
</html>
